<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Incident Details')}"></head>
<body>
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    
    <div class="main-content">
        <div class="mb-4">
            <a th:href="@{/incidents}" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Incidents</a>
            <h2 class="mt-2" th:text="'Incident Details: ' + ${incident.incidentCode}"></h2>
        </div>
        
        <div class="row">
            <div class="col-md-8">
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Information</h5>
                        <a th:href="@{/incidents/{id}/edit(id=${incident.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-4 text-muted">Type</div>
                            <div class="col-md-8" th:text="${incident.incidentType}"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4 text-muted">Severity</div>
                            <div class="col-md-8">
                                <span th:if="${incident.severity == 'LOW'}" class="badge bg-success">LOW</span>
                                <span th:if="${incident.severity == 'MEDIUM'}" class="badge bg-warning text-dark">MEDIUM</span>
                                <span th:if="${incident.severity == 'HIGH'}" class="badge bg-orange" style="background-color: #fd7e14;">HIGH</span>
                                <span th:if="${incident.severity == 'CRITICAL'}" class="badge bg-danger">CRITICAL</span>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4 text-muted">Status</div>
                            <div class="col-md-8">
                                <span th:if="${incident.status == 'REPORTED'}" class="badge bg-primary">REPORTED</span>
                                <span th:if="${incident.status == 'UNDER_INVESTIGATION'}" class="badge" style="background-color: purple;">UNDER INVESTIGATION</span>
                                <span th:if="${incident.status == 'IN_PROGRESS'}" class="badge bg-warning text-dark">IN PROGRESS</span>
                                <span th:if="${incident.status == 'RESOLVED'}" class="badge bg-success">RESOLVED</span>
                                <span th:if="${incident.status == 'CLOSED'}" class="badge bg-secondary">CLOSED</span>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4 text-muted">Description</div>
                            <div class="col-md-8" th:text="${incident.description}"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4 text-muted">Reported At</div>
                            <div class="col-md-8" th:text="${#temporals.format(incident.reportedAt, 'yyyy-MM-dd HH:mm:ss')}"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4 text-muted">Location</div>
                            <div class="col-md-8">
                                <span th:text="${incident.zoneName != null ? incident.zoneName : 'Zone ' + incident.zoneId}"></span>
                                <span th:if="${incident.latitude != null}" th:text="' (' + ${incident.latitude} + ', ' + ${incident.longitude} + ')'"></span>
                                <br>
                                <span class="small text-muted" th:text="${incident.locationDescription}"></span>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4 text-muted">Assigned Personnel</div>
                            <div class="col-md-8" th:text="${incident.assignedPersonnelName != null ? incident.assignedPersonnelName : 'Unassigned'}"></div>
                        </div>
                    </div>
                </div>
                
                <div class="card mb-4" th:if="${incident.resolutionDetails != null}">
                    <div class="card-header">
                        <h5 class="mb-0">Resolution Details</h5>
                    </div>
                    <div class="card-body">
                        <p th:text="${incident.resolutionDetails}"></p>
                        <p class="text-muted small" th:text="'Resolved at: ' + ${#temporals.format(incident.resolvedAt, 'yyyy-MM-dd HH:mm:ss')}"></p>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">Update Status</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/incidents/{id}/status(id=${incident.id})}" method="post">
                            <div class="mb-3">
                                <label class="form-label">New Status</label>
                                <select name="status" class="form-select" required>
                                    <option value="REPORTED" th:selected="${incident.status == 'REPORTED'}">REPORTED</option>
                                    <option value="UNDER_INVESTIGATION" th:selected="${incident.status == 'UNDER_INVESTIGATION'}">UNDER INVESTIGATION</option>
                                    <option value="IN_PROGRESS" th:selected="${incident.status == 'IN_PROGRESS'}">IN PROGRESS</option>
                                    <option value="CLOSED" th:selected="${incident.status == 'CLOSED'}">CLOSED</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Response Notes</label>
                                <textarea name="responseNotes" class="form-control" rows="3"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Update Status</button>
                        </form>
                    </div>
                </div>
                
                <div class="card mb-4" th:if="${incident.status != 'RESOLVED' and incident.status != 'CLOSED'}">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Resolve Incident</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/incidents/{id}/resolve(id=${incident.id})}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Resolution Details</label>
                                <textarea name="resolutionDetails" class="form-control" rows="4" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Mark as Resolved</button>
                        </form>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">History Log</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="p-3 bg-light border-bottom" style="max-height: 300px; overflow-y: auto; white-space: pre-wrap;" th:text="${incident.responseNotes}">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
