<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Monthly Incident Report')}"></head>
<body>
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    
    <div class="main-content">
        <h2 class="mb-4">Monthly Incident Report</h2>
        
        <div class="card mb-4">
            <div class="card-body">
                <form th:action="@{/incidents/report}" method="get" class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label">Zone Name or ID</label>
                        <input type="text" class="form-control" name="zoneId" th:value="${zoneId}" placeholder="Leave empty for all zones">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Month *</label>
                        <input type="month" class="form-control" name="month" th:value="${month}" required>
                    </div>
                    <div class="col-md-4">
                        <button type="submit" class="btn btn-primary w-100">Generate Report</button>
                    </div>
                </form>
            </div>
        </div>
        
        <div th:if="${showResults}">
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card bg-primary text-white text-center">
                        <div class="card-body">
                            <h3 th:text="${total}"></h3>
                            <p class="mb-0">Total Incidents</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-danger text-white text-center">
                        <div class="card-body">
                            <h3 th:text="${countCrit}"></h3>
                            <p class="mb-0">Critical</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-white text-center" style="background-color: #fd7e14;">
                        <div class="card-body">
                            <h3 th:text="${countHigh}"></h3>
                            <p class="mb-0">High</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-success text-white text-center">
                        <div class="card-body">
                            <h3 th:text="${countLow + countMed}"></h3>
                            <p class="mb-0">Low / Medium</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>Incident Code</th>
                                    <th>Type</th>
                                    <th>Severity</th>
                                    <th>Status</th>
                                    <th>Location/Zone</th>
                                    <th>Reported Date/Time</th>
                                    <th>Assigned Personnel</th>
                                    <th>Response Notes</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="incident : ${incidents}">
                                    <td th:text="${incident.incidentCode}"></td>
                                    <td th:text="${incident.incidentType}"></td>
                                    <td>
                                        <span th:if="${incident.severity == 'LOW'}" class="badge bg-success">LOW</span>
                                        <span th:if="${incident.severity == 'MEDIUM'}" class="badge bg-warning text-dark">MEDIUM</span>
                                        <span th:if="${incident.severity == 'HIGH'}" class="badge bg-orange" style="background-color: #fd7e14;">HIGH</span>
                                        <span th:if="${incident.severity == 'CRITICAL'}" class="badge bg-danger">CRITICAL</span>
                                    </td>
                                    <td th:text="${incident.status}"></td>
                                    <td th:text="${incident.zoneName != null ? incident.zoneName : 'Zone ' + incident.zoneId}"></td>
                                    <td th:text="${#temporals.format(incident.reportedAt, 'yyyy-MM-dd HH:mm')}"></td>
                                    <td th:text="${incident.assignedPersonnelName != null ? incident.assignedPersonnelName : 'None'}"></td>
                                    <td>
                                        <span class="d-inline-block text-truncate" style="max-width: 150px;" th:text="${incident.responseNotes != null ? incident.responseNotes : (incident.resolutionDetails != null ? incident.resolutionDetails : '')}"></span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(incidents)}">
                                    <td colspan="8" class="text-center py-4">
                                        <i class="bi bi-info-circle text-muted" style="font-size: 2rem;"></i>
                                        <p class="mt-2 text-muted">No incidents found for the selected month and zone.</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
    
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
