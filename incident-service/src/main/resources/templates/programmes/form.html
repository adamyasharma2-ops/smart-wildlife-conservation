<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${programme.id == null ? 'New Programme' : 'Edit Programme'})}"></head>
<body>
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    
    <div class="main-content">
        <div class="mb-4">
            <a th:href="@{/programmes}" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Programmes</a>
            <h2 class="mt-2" th:text="${programme.id == null ? 'New Conservation Programme' : 'Edit Programme'}"></h2>
        </div>
        
        <div class="card">
            <div class="card-body">
                <form th:action="${programme.id == null ? '/programmes' : '/programmes/' + programme.id + '/edit'}" th:object="${programme}" method="post">
                    
                    <div class="mb-3">
                        <label class="form-label">Programme Name *</label>
                        <input type="text" th:field="*{name}" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Objectives</label>
                        <textarea th:field="*{objectives}" class="form-control" rows="3"></textarea>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Start Date *</label>
                            <input type="date" th:field="*{startDate}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">End Date (Estimated)</label>
                            <input type="date" th:field="*{endDate}" class="form-control">
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Target Protected Area (ID)</label>
                            <input type="number" th:field="*{targetProtectedAreaId}" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Target Zone Name</label>
                            <input type="text" th:field="*{targetZoneName}" class="form-control">
                        </div>
                    </div>
                    
                    <div class="text-end mt-4">
                        <a th:href="${programme.id == null ? '/programmes' : '/programmes/' + programme.id}" class="btn btn-secondary me-2">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Programme</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
