<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NatureSheild | Sign In</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            950: '#070f1e',
                            900: '#0b192c',
                            850: '#0e223d',
                            800: '#152d4e',
                            700: '#1e3e62',
                            600: '#2b5484'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/wildguard.css}">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white rounded-lg border border-slate-200 shadow-sm p-8">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="w-10 h-10 bg-navy-900 rounded-md flex items-center justify-center text-white mx-auto mb-3">
                <i class="bi bi-shield-check text-lg"></i>
            </div>
            <h1 class="text-lg font-bold text-navy-900 tracking-tight">NatureSheild</h1>
            <p class="text-xs text-slate-500 mt-0.5">Wildlife & Protected Area Management</p>
        </div>

        <!-- Form -->
        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Officer ID</label>
                <input type="text" name="officerId" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-md focus:outline-none focus:border-navy-900 focus:ring-1 focus:ring-navy-900" value="FO-CORBETT-09" required>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Access Key</label>
                <input type="password" name="password" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-md focus:outline-none focus:border-navy-900 focus:ring-1 focus:ring-navy-900" value="••••••••••••" required>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Command Station</label>
                <select class="w-full text-sm px-3 py-2 border border-slate-200 rounded-md focus:outline-none focus:border-navy-900 focus:ring-1 focus:ring-navy-900 bg-white">
                    <option selected>Dhikala Sector HQ (Corbett Reserve)</option>
                    <option>Central Zone Command (Ranthambore)</option>
                    <option>Kaziranga North Outpost</option>
                </select>
            </div>

            <button type="submit" class="w-full mt-2 bg-navy-900 hover:bg-navy-800 text-white text-xs font-semibold uppercase tracking-wider py-2.5 rounded-md transition duration-150">
                Sign In
            </button>
        </form>

        <div class="text-center mt-6 pt-4 border-t border-slate-100">
            <span class="text-xs text-slate-400">Team 27 &bull; Enterprise Microservices</span>
        </div>
    </div>
</body>
</html>
