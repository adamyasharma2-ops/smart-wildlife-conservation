<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NatureSheild | Field Operations Authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/wildguard.css}">
    <style>
        .login-bg {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1128 0%, #101f42 50%, #1e3a8a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            max-width: 440px;
            width: 100%;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
            overflow: hidden;
        }
        .login-header {
            background: #0f1c3f;
            color: #ffffff;
            padding: 2rem 2rem 1.6rem 2rem;
            text-align: center;
            border-bottom: 2px solid #1e3a8a;
        }
        .login-body {
            padding: 2rem;
        }
        .badge-sector {
            background-color: #1e3a8a;
            color: #bfdbfe;
            font-size: 0.72rem;
            letter-spacing: 0.05em;
            padding: 0.3rem 0.7rem;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
        }
        .auth-input-group .form-control {
            border: 1px solid #cbd5e1;
            padding: 0.65rem 0.85rem;
            font-size: 0.92rem;
        }
        .auth-input-group .form-control:focus {
            border-color: #1e3a8a;
            box-shadow: 0 0 0 0.2rem rgba(30, 58, 138, 0.15);
        }
        .btn-enter-console {
            background: #1e3a8a;
            border: none;
            padding: 0.7rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: white;
            transition: background 0.15s;
        }
        .btn-enter-console:hover {
            background: #172554;
        }
    </style>
</head>
<body class="login-bg">
    <div class="login-card">
        <div class="login-header">
            <span class="badge-sector"><i class="bi bi-shield-lock-fill me-1"></i> Authorized Portal</span>
            <div class="d-flex align-items-center justify-content-center gap-2 mb-1">
                <i class="bi bi-shield-check fs-2 text-primary" style="color: #60a5fa !important;"></i>
                <h2 class="mb-0 fw-bold" style="letter-spacing: -0.02em;">Nature<span style="color: #60a5fa;">Sheild</span></h2>
            </div>
            <p class="mb-0 text-white-50 small">Protected Area Authority & Conservation System</p>
        </div>
        
        <div class="login-body">
            <div class="alert alert-light border small text-muted mb-4 d-flex align-items-start gap-2">
                <i class="bi bi-info-circle-fill text-primary fs-5"></i>
                <div>
                    Authorized Officer session credentials pre-filled for local test deployment.
                </div>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3 auth-input-group">
                    <label class="form-label small fw-semibold text-secondary">OFFICER IDENTIFICATION CODE</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person-badge"></i></span>
                        <input type="text" name="officerId" class="form-control border-start-0 ps-0" value="FO-CORBETT-09" required>
                    </div>
                </div>

                <div class="mb-3 auth-input-group">
                    <label class="form-label small fw-semibold text-secondary">SECURITY ACCESS KEY</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-key-fill"></i></span>
                        <input type="password" name="password" class="form-control border-start-0 ps-0" value="••••••••••••" required>
                    </div>
                </div>

                <div class="mb-4 auth-input-group">
                    <label class="form-label small fw-semibold text-secondary">COMMAND STATION</label>
                    <select class="form-select bg-light text-secondary border">
                        <option selected>Dhikala Sector HQ (Corbett Reserve)</option>
                        <option>Central Zone Command (Ranthambore)</option>
                        <option>Kaziranga North Outpost</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-enter-console w-100 rounded-2 mb-3">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>

            <div class="text-center pt-2 border-top">
                <small class="text-muted" style="font-size: 0.72rem;">
                    NatureSheild Enterprise Microservices Architecture &bull; VIT Hackathon
                </small>
            </div>
        </div>
    </div>
</body>
</html>
