<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Species Catalogue')}"></head>
<body>
<div class="d-flex">
    <nav th:replace="~{layout :: sidebar('species')}"></nav>
    <div class="main-content flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-success-emphasis mb-0">Wildlife Species Catalogue</h2>
                <small class="text-muted">Manage Protected Fauna & Biological Classification Profiles</small>
            </div>
            <a th:href="@{/species/new}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Add Species</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Common Name</th>
                            <th>Scientific Name</th>
                            <th>Conservation Status</th>
                            <th>Typical Habitat</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${speciesList}">
                            <td class="fw-bold" th:text="${s.commonName}">Tiger</td>
                            <td class="fst-italic" th:text="${s.scientificName}">Panthera tigris</td>
                            <td><span class="badge bg-danger" th:text="${s.conservationStatus}">ENDANGERED</span></td>
                            <td th:text="${s.habitat}">Deciduous forests</td>
                            <td>
                                <a th:href="@{'/species/' + ${s.id}}" class="btn btn-sm btn-outline-primary"><i class="bi bi-eye"></i></a>
                                <a th:href="@{'/species/' + ${s.id} + '/edit'}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
