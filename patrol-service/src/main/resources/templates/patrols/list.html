<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Patrol Operations')}"></head>
<body>
<div class="d-flex">
    <nav th:replace="~{layout :: sidebar('patrols')}"></nav>
    <div class="main-content flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-success-emphasis mb-0">Patrol Operations</h2>
                <small class="text-muted">Manage Protected Area Field Patrol Schedules & Assignments</small>
            </div>
            <a th:href="@{/patrols/new}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Schedule Patrol</a>
        </div>
        <div class="card shadow-sm border-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr><th>Patrol ID</th><th>Protected Area / Zone</th><th>Planned Start</th><th>Status</th><th>Observations</th><th>Action</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${patrols}">
                            <td><span class="badge bg-dark" th:text="${p.patrolId}">PTR-001</span></td>
                            <td th:text="${p.protectedAreaName + ' - ' + p.zoneName}">Area - Zone</td>
                            <td th:text="${p.plannedStartTime}">Start</td>
                            <td>
                                <span class="badge" th:classappend="${p.status == 'COMPLETED' ? 'bg-success' : (p.status == 'IN_PROGRESS' ? 'bg-warning text-dark' : 'bg-primary')}" th:text="${p.status}">STATUS</span>
                            </td>
                            <td th:text="${p.observations != null ? p.observations : 'None recorded'}">Observations</td>
                            <td><a th:href="@{'/patrols/' + ${p.id}}" class="btn btn-sm btn-outline-primary"><i class="bi bi-eye me-1"></i>Manage</a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
