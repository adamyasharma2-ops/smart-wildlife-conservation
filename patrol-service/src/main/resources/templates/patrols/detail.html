<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Patrol Management')}"></head>
<body>
<div class="d-flex">
    <nav th:replace="~{layout :: sidebar('patrols')}"></nav>
    <div class="main-content flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-success-emphasis mb-0">Patrol: <span th:text="${patrol.patrolId}"></span></h2>
                <small class="text-muted">Status: <span class="badge bg-info text-dark" th:text="${patrol.status}"></span></small>
            </div>
            <div class="d-flex gap-2">
                <form th:if="${patrol.status == 'PLANNED'}" th:action="@{'/patrols/' + ${patrol.id} + '/start'}" method="post">
                    <button type="submit" class="btn btn-warning"><i class="bi bi-play-circle me-1"></i>Start Patrol</button>
                </form>
                <a th:href="@{/patrols}" class="btn btn-outline-dark">Back to List</a>
            </div>
        </div>

        <!-- Complete patrol form if in progress -->
        <div th:if="${patrol.status == 'IN_PROGRESS'}" class="card shadow-sm border-0 mb-4 bg-light">
            <div class="card-header bg-warning-subtle fw-bold text-dark"><i class="bi bi-check2-circle me-2"></i>Complete Patrol & Log Field Observations</div>
            <div class="card-body p-4">
                <form th:action="@{'/patrols/' + ${patrol.id} + '/complete'}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Field Observations *</label>
                        <textarea class="form-control" name="observations" rows="2" placeholder="Record animal tracks, fence breaches, water source status..." required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Patrol Outcome *</label>
                        <input type="text" class="form-control" name="outcome" placeholder="e.g. Routine perimeter cleared, no infractions detected." required>
                    </div>
                    <button type="submit" class="btn btn-success"><i class="bi bi-check-circle me-1"></i>Complete Patrol & Release Resources</button>
                </form>
            </div>
        </div>

        <!-- Assigned personnel -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white fw-bold py-3">Assigned Field Personnel</div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light"><tr><th>Personnel Name</th><th>Role</th><th>Assigned At</th></tr></thead>
                    <tbody>
                        <tr th:each="sa : ${staffAssignments}">
                            <td class="fw-bold" th:text="${sa.staffName}"></td>
                            <td><span class="badge bg-secondary" th:text="${sa.role}"></span></td>
                            <td th:text="${sa.assignedAt}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${patrol.status != 'COMPLETED'}" class="card-footer bg-white">
                <form th:action="@{'/patrols/' + ${patrol.id} + '/assign-staff'}" method="post" class="row g-2 align-items-center">
                    <div class="col-md-6">
                        <select name="staffId" class="form-select" required>
                            <option value="">-- Select Available Staff --</option>
                            <option th:each="s : ${availableStaff}" th:value="${s.id}" th:text="${s.fullName + ' (' + s.designation + ')'}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <select name="role" class="form-select">
                            <option value="MEMBER">Team Member</option>
                            <option value="LEADER">Patrol Leader</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Assign Staff</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Allocated resources -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white fw-bold py-3">Allocated Vehicles & Equipment</div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light"><tr><th>Type</th><th>Resource Name</th><th>Assigned At</th><th>Status</th></tr></thead>
                    <tbody>
                        <tr th:each="ra : ${resourceAssignments}">
                            <td><span class="badge bg-dark" th:text="${ra.resourceType}"></span></td>
                            <td th:text="${ra.resourceName}"></td>
                            <td th:text="${ra.assignedAt}"></td>
                            <td><span class="badge" th:classappend="${ra.releasedAt == null ? 'bg-warning text-dark' : 'bg-success'}" th:text="${ra.releasedAt == null ? 'IN USE' : 'RELEASED'}"></span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${patrol.status != 'COMPLETED'}" class="card-footer bg-white">
                <div class="row g-2">
                    <div class="col-md-6">
                        <form th:action="@{'/patrols/' + ${patrol.id} + '/assign-vehicle'}" method="post" class="d-flex gap-2">
                            <select name="vehicleId" class="form-select" required>
                                <option value="">-- Assign Available Vehicle --</option>
                                <option th:each="v : ${availableVehicles}" th:value="${v.id}" th:text="${v.vehicleNumber + ' (' + v.vehicleType + ')'}"></option>
                            </select>
                            <button type="submit" class="btn btn-outline-success">Assign</button>
                        </form>
                    </div>
                    <div class="col-md-6">
                        <form th:action="@{'/patrols/' + ${patrol.id} + '/assign-equipment'}" method="post" class="d-flex gap-2">
                            <select name="equipmentId" class="form-select" required>
                                <option value="">-- Assign Equipment --</option>
                                <option th:each="e : ${availableEquipment}" th:value="${e.id}" th:text="${e.name + ' (' + e.equipmentCode + ')'}"></option>
                            </select>
                            <button type="submit" class="btn btn-outline-success">Assign</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
