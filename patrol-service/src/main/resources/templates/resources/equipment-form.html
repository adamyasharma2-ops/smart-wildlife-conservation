<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Add Equipment')}"></head>
<body>
<div class="d-flex">
    <nav th:replace="~{layout :: sidebar('resources')}"></nav>
    <div class="main-content flex-grow-1 p-4">
        <h2 class="fw-bold text-success-emphasis mb-3">Add Field Equipment</h2>
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form th:action="@{/resources/equipment}" th:object="${equipment}" method="post">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6"><label class="form-label fw-semibold">Equipment Code *</label><input type="text" class="form-control" th:field="*{equipmentCode}" required></div>
                        <div class="col-md-6"><label class="form-label fw-semibold">Equipment Name *</label><input type="text" class="form-control" th:field="*{name}" required></div>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6"><label class="form-label fw-semibold">Category</label><select class="form-select" th:field="*{category}"><option value="COMMUNICATION">Communication</option><option value="TRACKING">Tracking & Optics</option><option value="FIRST_AID">First Aid</option><option value="OTHER">Other</option></select></div>
                        <div class="col-md-6"><label class="form-label fw-semibold">Condition</label><input type="text" class="form-control" th:field="*{condition}" value="GOOD"></div>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Equipment</button>
                    <a th:href="@{/resources}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
