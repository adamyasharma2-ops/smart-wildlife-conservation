<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Vehicles & Equipment')}"></head>
<body>
<div class="d-flex">
    <nav th:replace="~{layout :: sidebar('resources')}"></nav>
    <div class="main-content flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-success-emphasis mb-0">Field Vehicles & Equipment Inventory</h2>
                <small class="text-muted">Track Asset Utilization, Condition & Active Allocations</small>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/resources/vehicles/new}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Add Vehicle</a>
                <a th:href="@{/resources/equipment/new}" class="btn btn-outline-success"><i class="bi bi-plus-circle me-1"></i>Add Equipment</a>
            </div>
        </div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white fw-bold py-3"><i class="bi bi-truck me-2 text-success"></i>Fleet Vehicles</div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light"><tr><th>Reg Number</th><th>Type</th><th>Model</th><th>Status</th><th>Condition</th><th>Assigned Area</th></tr></thead>
                    <tbody>
                        <tr th:each="v : ${vehicles}">
                            <td class="fw-bold" th:text="${v.vehicleNumber}"></td>
                            <td th:text="${v.vehicleType}"></td>
                            <td th:text="${v.model}"></td>
                            <td><span class="badge" th:classappend="${v.status == 'AVAILABLE' ? 'bg-success' : 'bg-warning text-dark'}" th:text="${v.status}"></span></td>
                            <td th:text="${v.condition}"></td>
                            <td th:text="${v.assignedAreaName}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-white fw-bold py-3"><i class="bi bi-tools me-2 text-success"></i>Field Equipment & Sensors</div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light"><tr><th>Code</th><th>Name</th><th>Category</th><th>Status</th><th>Condition</th></tr></thead>
                    <tbody>
                        <tr th:each="e : ${equipment}">
                            <td class="fw-bold" th:text="${e.equipmentCode}"></td>
                            <td th:text="${e.name}"></td>
                            <td th:text="${e.category}"></td>
                            <td><span class="badge" th:classappend="${e.status == 'AVAILABLE' ? 'bg-success' : 'bg-warning text-dark'}" th:text="${e.status}"></span></td>
                            <td th:text="${e.condition}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
