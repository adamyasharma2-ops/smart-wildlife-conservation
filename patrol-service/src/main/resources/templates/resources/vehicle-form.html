<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Add Vehicle')}"></head>
<body>
<div class="d-flex">
    <nav th:replace="~{layout :: sidebar('resources')}"></nav>
    <div class="main-content flex-grow-1 p-4">
        <h2 class="fw-bold text-success-emphasis mb-3">Add Fleet Vehicle</h2>
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form th:action="@{/resources/vehicles}" th:object="${vehicle}" method="post">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6"><label class="form-label fw-semibold">Registration Number *</label><input type="text" class="form-control" th:field="*{vehicleNumber}" required></div>
                        <div class="col-md-6"><label class="form-label fw-semibold">Type</label><select class="form-select" th:field="*{vehicleType}"><option value="JEEP">Jeep / SUV</option><option value="TRUCK">Truck</option><option value="MOTORCYCLE">Motorcycle</option><option value="BOAT">Patrol Boat</option></select></div>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6"><label class="form-label fw-semibold">Model</label><input type="text" class="form-control" th:field="*{model}"></div>
                        <div class="col-md-6"><label class="form-label fw-semibold">Assigned Area</label><input type="text" class="form-control" th:field="*{assignedAreaName}"></div>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Vehicle</button>
                    <a th:href="@{/resources}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
