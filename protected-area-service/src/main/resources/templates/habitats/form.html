<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${habitat.id == null ? 'New Habitat' : 'Edit Habitat'})}"></head>
<body>
    <div th:replace="~{fragments :: sidebar}"></div>
    
    <div class="main-content">
        <div class="container-fluid">
            <h2 class="mb-4" th:text="${habitat.id == null ? 'Add New Habitat' : 'Edit Habitat'}"></h2>

            <div class="card">
                <div class="card-body">
                    <form th:action="@{${habitat.id == null ? '/habitats' : '/habitats/' + habitat.id + '/edit'}}" th:object="${habitat}" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Habitat Type</label>
                                <select class="form-select" th:field="*{habitatType}">
                                    <option value="TROPICAL_FOREST">Tropical Forest</option>
                                    <option value="DECIDUOUS_FOREST">Deciduous Forest</option>
                                    <option value="GRASSLAND">Grassland</option>
                                    <option value="WETLAND">Wetland</option>
                                    <option value="SCRUBLAND">Scrubland</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Zone</label>
                                <select class="form-select" th:field="*{zoneId}" required>
                                    <option value="" disabled selected>Select Zone</option>
                                    <option th:each="z : ${zones}" th:value="${z.id}" th:text="${z.name + ' (' + z.protectedAreaName + ')'}"></option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Condition</label>
                                <select class="form-select" th:field="*{condition}">
                                    <option value="EXCELLENT">Excellent</option>
                                    <option value="GOOD">Good</option>
                                    <option value="FAIR">Fair</option>
                                    <option value="DEGRADED">Degraded</option>
                                </select>
                            </div>
                        </div>
                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">Save Habitat</button>
                            <a href="/habitats" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
