<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Zones')}"></head>
<body>
    <div th:replace="~{fragments :: sidebar}"></div>
    
    <div class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Zones</h2>
                <a href="/zones/new" class="btn btn-primary">Add Zone</a>
            </div>

            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Code</th>
                                    <th>Name</th>
                                    <th>Protected Area</th>
                                    <th>Type</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="zone : ${zones}">
                                    <td th:text="${zone.zoneCode}">Z-001</td>
                                    <td th:text="${zone.name}">Core Zone</td>
                                    <td th:text="${zone.protectedAreaName}">Corbett</td>
                                    <td th:text="${zone.zoneType}">CORE</td>
                                    <td>
                                        <span th:class="${zone.status == 'ACTIVE' ? 'badge bg-success' : 'badge bg-warning'}"
                                              th:text="${zone.status}">ACTIVE</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/zones/{id}(id=${zone.id})}" class="btn btn-sm btn-info text-white">View</a>
                                        <a th:href="@{/zones/{id}/edit(id=${zone.id})}" class="btn btn-sm btn-secondary">Edit</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
