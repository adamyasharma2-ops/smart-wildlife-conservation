<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Error')}"></head>
<body>
    <div th:replace="~{fragments :: sidebar}"></div>
    
    <div class="main-content">
        <div class="container-fluid">
            <div class="row mt-5">
                <div class="col-md-8 offset-md-2 text-center">
                    <h1 class="display-4 text-danger">Oops! Something went wrong.</h1>
                    <p class="lead mt-4" th:text="${errorMessage}">Error occurred.</p>
                    <a href="/areas" class="btn btn-primary mt-3">Return to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
    
    <div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
