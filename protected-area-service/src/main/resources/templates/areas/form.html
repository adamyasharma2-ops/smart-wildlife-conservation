<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${area.id == null ? 'New Area' : 'Edit Area'})}"></head>
<body>
    <div th:replace="~{fragments :: sidebar}"></div>
    
    <div class="main-content">
        <div class="container-fluid">
            <h2 class="mb-4" th:text="${area.id == null ? 'Add New Protected Area' : 'Edit Protected Area'}"></h2>

            <div class="card">
                <div class="card-body">
                    <form th:action="@{${area.id == null ? '/areas' : '/areas/' + area.id + '/edit'}}" th:object="${area}" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Area Code</label>
                                <input type="text" class="form-control" th:field="*{areaCode}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Name</label>
                                <input type="text" class="form-control" th:field="*{name}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Area Type</label>
                                <select class="form-select" th:field="*{areaType}">
                                    <option value="NATIONAL_PARK">National Park</option>
                                    <option value="WILDLIFE_SANCTUARY">Wildlife Sanctuary</option>
                                    <option value="BIOSPHERE_RESERVE">Biosphere Reserve</option>
                                    <option value="TIGER_RESERVE">Tiger Reserve</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Status</label>
                                <select class="form-select" th:field="*{status}">
                                    <option value="ACTIVE">Active</option>
                                    <option value="INACTIVE">Inactive</option>
                                    <option value="UNDER_REVIEW">Under Review</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">State</label>
                                <input type="text" class="form-control" th:field="*{state}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Total Area (km²)</label>
                                <input type="number" step="0.01" class="form-control" th:field="*{totalAreaKm2}">
                            </div>
                        </div>
                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">Save Area</button>
                            <a href="/areas" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
